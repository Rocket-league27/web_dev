<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Phone Contact</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { background-color: #F0F0F2; }
    h1   { color: #FF5A43; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre  { font-size: 13px; color: #333; }
  </style>
</head>
<body class="py-4">

  <div class="container">

    <h1 class="mb-1">My Phone Contact</h1>
    <p class="text-muted mb-4">
      Introduction to Objects in JavaScript
    </p>

    <!-- Contact Card -->
    <div class="card shadow-sm mb-3" style="max-width:400px;">
      <div class="card-body">
        <h5 class="card-title" style="color:#FF5A43;">Contact Details</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <span class="card-label d-block">Name</span>
            <strong id="name"></strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">Phone</span>
            <strong id="phone"></strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">School</span>
            <strong id="school"></strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">City</span>
            <strong id="city">—</strong>
          </li>
        </ul>
      </div>
    </div>
    
  </div><!-- /container -->

  <script>

    // Step 1 — Create the contact object
    var myContact = {
      name:   "Akshat",
        phone: "7900998743",
        school: "qes",
        city: "haryana"
      // TODO: Add phone, school and city properties
    


    };

    var nameEle  = document.getElementById("name");
    nameEle.textContent  = myContact.name;

    // TODO: Get the elements by id for phone, school and city and update their textContent with the values.
    var phoneele = document.getElementById("phone");
    phoneele.textContent =myContact.phone;
    var schoolele =document.getElementById("school");
    schoolele.textContent =myContact.school;
    var cityele =document.getElementById("city");
    cityele.textContent =myContact.city;

  </script>

</body>
</html>
