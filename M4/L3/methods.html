<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
    var str = "AmAzInG";
    // TODO: Use the method toUpperCase() to convert the string to uppercase
    var upperstr = str.toUpperCase();
    console.log(upperstr);
    // TODO: Use the method toLowerCase() to convert the string to lowercase
    var lowerstr = str.toLowerCase();
    console.log(lowerstr);



    // Test Method -> returns true or false
    var str1 = "I learnt about Methods";
    var patt = /about/;
    
    // TODO: use the test() method to check if the string contains the word "about"
    var result = patt.test(str1);
    console.log(result);
    </script>
  </body>
</html>
